name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      # Same script used locally, so CI and a developer machine cannot drift.
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Config Release

      - name: Hash agreement check
        # The one failure that is otherwise invisible: if the C++ and C# path
        # hashes ever disagree, hearts silently stop drawing.
        shell: pwsh
        run: |
          cmake -S tools/probe -B build/probe -A x64
          cmake --build build/probe --config Release
          dotnet build tools/selftest/SelfTest.csproj -c Release
          $dir = 'C:\Windows\System32'
          $a = (& tools/selftest/bin/Release/net7.0/SelfTest.exe hash $dir) -replace '.*-> ',''
          $b = ((& build/probe/Release/probe.exe --hash $dir) | Select-Object -Last 1) -replace '.*-> ',''
          "C#  $a"; "C++ $b"
          if ($a -ne $b) { throw "hash mismatch between C# and C++" }

      - uses: actions/upload-artifact@v4
        with:
          name: heartmark-${{ github.sha }}
          path: dist/
          if-no-files-found: error
